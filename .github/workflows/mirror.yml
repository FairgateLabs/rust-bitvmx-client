# GENERATED-CODE PUBLISHER — the commits/tags this workflow produces on
# FairgateLabs/rust-bitvmx-client-types are machine-generated by scripts/mirror.py.
# Never hand-edit files in that repo; see its README for the hand-written surface.
name: mirror

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "version to build as (e.g. v0.8.5)"
        required: true
      publish:
        description: "commit, tag and push the mirror"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git with Token Authentication
        run: |
          git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          REPO_TOKEN: ${{ secrets.BITVMX_CLIENT_TYPES_WRITE }}

      - name: Check out client at tag
        uses: actions/checkout@v7
        with:
          path: client
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          persist-credentials: false

      - name: Check out mirror
        uses: actions/checkout@v7
        with:
          repository: FairgateLabs/rust-bitvmx-client-types
          path: mirror
          persist-credentials: false

      # Advisory only: a hand-edit in the generated tree is a process problem
      # to fix in the next PR, not a reason to block a release the regenerate
      # is about to overwrite anyway.
      - name: Warn on hand-edited mirror files
        run: python3 client/scripts/mirror.py --check --out mirror

      - name: Regenerate mirror from client
        id: regenerate
        run: |
          before=$(sed -n '/^\[files]/,$p' mirror/mirror.toml)
          python3 client/scripts/mirror.py \
            --client-dir client \
            --out mirror \
            --tag "$TAG"
          after=$(sed -n '/^\[files]/,$p' mirror/mirror.toml)
          # Byte-identical contract: the crate this would publish differs from
          # the last release only by its version stamp, so there is nothing to
          # release. Dependency-only changes are deliberately not a release
          # trigger either -- the contract is what consumers pin this crate for.
          if [ "$before" = "$after" ]; then
            echo "contract unchanged -- skipping publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp mirror Cargo.toml version from tag
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            /^\[/ { in_pkg = ($0 == "[package]") }
            in_pkg && /^version = / { $0 = "version = \"" ver "\"" }
            { print }
          ' mirror/Cargo.toml > mirror/Cargo.toml.tmp
          mv mirror/Cargo.toml.tmp mirror/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: |
          rm -f Cargo.lock
          cargo test
        working-directory: mirror

      - name: Commit mirror
        if: steps.regenerate.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish)
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Regenerate mirror at $TAG"

      - name: Tag and push mirror
        if: steps.regenerate.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish)
        working-directory: mirror
        run: |
          git tag "$TAG"
          # The release lands on its own branch, never on main: main is ruleset
          # protected and moves only by PR. The tag is what consumers pin, and a
          # tag resolves regardless of which branch carries the commit, so the
          # crate is usable the moment this push lands -- merging is bookkeeping.
          #
          # Atomic: a rejected tag (e.g. re-tagging an existing release) must not
          # leave the branch pushed without it — that half-publishes the release.
          git push --atomic origin "HEAD:refs/heads/release/$TAG" "refs/tags/$TAG"
