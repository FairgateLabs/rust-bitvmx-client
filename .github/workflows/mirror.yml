# GENERATED-CODE PUBLISHER — the commits/tags this workflow produces on
# FairgateLabs/rust-bitvmx-client-types are machine-generated by scripts/mirror.py.
# Never hand-edit files in that repo; see its README for the hand-written surface.
name: mirror

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out client at tag
        uses: actions/checkout@v4
        with:
          path: client
          ref: ${{ github.ref_name }}

      - name: Check out mirror
        uses: actions/checkout@v4
        with:
          repository: FairgateLabs/rust-bitvmx-client-types
          path: mirror
          token: ${{ secrets.MIRROR_PUSH_TOKEN }}

      - name: Regenerate mirror from client
        run: |
          python3 client/scripts/mirror.py \
            --client-dir client \
            --out mirror \
            --tag ${{ github.ref_name }}

      - name: Stamp mirror Cargo.toml version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^\[/ { in_pkg = ($0 == "[package]") }
            in_pkg && /^version = / { $0 = "version = \"" ver "\"" }
            { print }
          ' mirror/Cargo.toml > mirror/Cargo.toml.tmp
          mv mirror/Cargo.toml.tmp mirror/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test
        working-directory: mirror

      - name: Commit mirror
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Regenerate mirror at ${{ github.ref_name }}"

      - name: Tag and push mirror
        working-directory: mirror
        run: |
          git tag "$GITHUB_REF_NAME"
          # Atomic: a rejected tag (e.g. re-tagging an existing release) must not
          # leave main advanced without it — that half-publishes the release.
          git push --atomic origin HEAD:main "refs/tags/$GITHUB_REF_NAME"
