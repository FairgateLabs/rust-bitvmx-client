name: Build and publish client image

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'force-build-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged client
        uses: actions/checkout@v7

      - name: Determine image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#force-build-}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PUSH_DOCKER_TOKEN }}

      - name: Build and publish client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.bitvmx.from_client
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/fairgatelabs/rust-bitvmx-workspace/bitvmx-client:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/FairgateLabs/rust-bitvmx-client
          no-cache: true
          push: true
